<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
  </defs>
  <!-- Background plaque -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" stroke="#292524" stroke-width="1.5" />
  
  <!-- Subtle inner hairline frame -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="#44403c" stroke-width="0.75" stroke-opacity="0.6" />
  
  <!-- Classic Monogram M -->
  <text 
    x="30" 
    y="44" 
    font-family="'Newsreader', Georgia, 'Times New Roman', serif" 
    font-size="34" 
    font-style="italic" 
    font-weight="500" 
    fill="#f5f5f4" 
    text-anchor="middle"
    letter-spacing="-1"
  >M</text>
  
  <!-- Elegant classic accent dot -->
  <circle cx="46" cy="42" r="2.2" fill="#d6d3d1" />
</svg>